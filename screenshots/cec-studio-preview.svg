<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#0a0e17" />
  <rect x="0" y="0" width="1200" height="80" fill="#111827" stroke="#334155" stroke-width="1" />
  <text x="40" y="48" fill="#f59e0b" font-family="sans-serif" font-size="24" font-weight="bold">CECForge Pro</text>
  <text x="240" y="48" fill="#94a3b8" font-family="sans-serif" font-size="14">v1.0.0 — HDMI-CEC Pin 13 Single-Wire Bus Studio</text>
  <rect x="920" y="26" width="240" height="30" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1" />
  <text x="1040" y="46" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">HDMI PIN 13 CEC BUS ACTIVE</text>

  <!-- Left Card: Frame Wire Format -->
  <rect x="40" y="120" width="540" height="480" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="65" y="160" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">One Touch Play &amp; Frame Telemetry</text>
  <text x="65" y="195" fill="#94a3b8" font-family="sans-serif" font-size="14">Initiator: Playback 1 (0x4) | Destination: Broadcast (0xF)</text>
  <text x="65" y="225" fill="#94a3b8" font-family="sans-serif" font-size="14">Opcode: ACTIVE_SOURCE (0x82) | Physical Address: 1.0.0.0</text>

  <rect x="65" y="255" width="490" height="75" rx="6" fill="#0f172a" />
  <text x="80" y="280" fill="#94a3b8" font-family="monospace" font-size="11">ASSEMBLED CEC FRAME BYTE STREAM</text>
  <text x="80" y="308" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="bold">4F : 82 : 10 : 00</text>

  <rect x="65" y="350" width="490" height="220" rx="6" fill="#0f172a" />
  <text x="80" y="380" fill="#94a3b8" font-family="monospace" font-size="11">10-POINT NORMATIVE AUDIT STATUS</text>
  <text x="80" y="410" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">Score: 100% PASS (10/10 Standard Checks)</text>
  <text x="80" y="440" fill="#94a3b8" font-family="monospace" font-size="12">Start Bit 3.7ms Low / 4.5ms Total: [PASS]</text>
  <text x="80" y="465" fill="#94a3b8" font-family="monospace" font-size="12">10-Bit Block Structure (8 Data + 1 EOM + 1 ACK): [PASS]</text>
  <text x="80" y="490" fill="#94a3b8" font-family="monospace" font-size="12">Broadcast Destination Rules for 0x82: [PASS]</text>
  <text x="80" y="515" fill="#94a3b8" font-family="monospace" font-size="12">Signal Free Time Quiet Period (5/7 Bits): [PASS]</text>

  <!-- Right Card: Waveform Timing -->
  <rect x="620" y="120" width="540" height="480" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="645" y="160" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">HDMI Pin 13 CEC Physical Wire Timing</text>
  <rect x="645" y="185" width="490" height="385" rx="6" fill="#0f172a" />
  <path d="M 665 300 L 665 400 L 760 400 L 760 300 L 790 300 L 790 400 L 840 400 L 840 300 L 870 300 L 870 400 L 890 400 L 890 300 L 960 300" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <text x="665" y="225" fill="#94a3b8" font-family="monospace" font-size="12">Start Bit: 3.7ms low, 4.5ms total duration</text>
  <text x="665" y="250" fill="#94a3b8" font-family="monospace" font-size="12">Logic 0: 1.5ms low | Logic 1: 0.6ms low (2.4ms total)</text>
  <text x="665" y="275" fill="#10b981" font-family="monospace" font-size="12">Sample Point: 1.05ms nominal</text>
</svg>
